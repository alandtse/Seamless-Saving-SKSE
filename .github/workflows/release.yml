name: Semantic Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version to upload to Nexus (leave empty for latest release)"
        type: string
        required: false

# Least-privilege default token; jobs opt into write scopes only where needed.
permissions:
  contents: read

jobs:
  semantic-release:
    name: Semantic Release
    runs-on: windows-latest
    if: github.event_name == 'push' && github.repository_owner == 'alandtse'
    permissions:
      contents: write # create tags, changelog commits, and the GitHub release
      issues: write # semantic-release comments on released issues
      pull-requests: write # semantic-release comments on released PRs

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: "recursive"

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6
        id: semantic
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            @semantic-release/github
            @google/semantic-release-replace-plugin
          dry_run: false
          semantic_version: 24.2.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      new_release_git_tag: ${{ steps.semantic.outputs.new_release_git_tag }}
      new_release_notes: ${{ steps.semantic.outputs.new_release_notes }}

  build:
    name: Build Release
    needs: semantic-release
    if: |
      always() &&
      (needs.semantic-release.result == 'success' || needs.semantic-release.result == 'skipped') &&
      (needs.semantic-release.outputs.new_release_published == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    uses: ./.github/workflows/build-reusable.yml
    with:
      version: ${{ needs.semantic-release.outputs.new_release_version || inputs.version }}
      upload-artifact: true
      ref: main

  upload-github-release:
    name: Upload GitHub Release
    needs: [semantic-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the release asset
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.semantic-release.outputs.new_release_published == 'true' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Download artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.build.outputs.artifact-name }}

      - name: Get version for upload
        id: version
        run: |
          VERSION="${{ needs.semantic-release.outputs.new_release_version || inputs.version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      - name: Upload files to GitHub release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true
          file: "*.7z"
          tag: ${{ needs.semantic-release.outputs.new_release_git_tag || steps.version.outputs.tag }}
          overwrite: true

  # Upload to Nexus VR version (fork-specific, alandtse repo only)
  upload-to-nexus-vr:
    name: Upload to Nexus Mods (VR)
    needs: [semantic-release, build, upload-github-release]
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.upload-github-release.result == 'success' &&
      (needs.semantic-release.outputs.new_release_published == 'true' || github.event_name == 'workflow_dispatch') &&
      github.repository_owner == 'alandtse'
    # Pin the shared reusable to a release tag (not @main) — supply-chain hygiene.
    uses: alandtse/nexus-workflows/.github/workflows/upload-nexus.yml@v1.4.0
    with:
      nexus_game_id: skyrimspecialedition
      nexus_mod_id: 174106 # VR version
      artifact_name: ${{ needs.semantic-release.outputs.new_release_published == 'true' && format('SeamlessSaving_{0}', startsWith(needs.semantic-release.outputs.new_release_version, 'v') && substring(needs.semantic-release.outputs.new_release_version, 1) || needs.semantic-release.outputs.new_release_version) || '' }}
      tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' && format('v{0}', inputs.version) || '' }}
      mod_version: ${{ needs.semantic-release.outputs.new_release_version && (startsWith(needs.semantic-release.outputs.new_release_version,'v') && substring(needs.semantic-release.outputs.new_release_version,1) || needs.semantic-release.outputs.new_release_version) || inputs.version && (startsWith(inputs.version,'v') && substring(inputs.version,1) || inputs.version) || '' }}
      mod_filename: Seamless Saving VR
      changelog: ${{ needs.semantic-release.outputs.new_release_notes }}
      file_description: |
        See Description → Requirements for installation instructions.
        PDB is for crash debugging and can be removed.
      previous_file: auto
    secrets:
      UNEX_NEXUSMODS_SESSION_COOKIE: ${{ secrets.UNEX_NEXUSMODS_SESSION_COOKIE }}
      UNEX_APIKEY: ${{ secrets.UNEX_APIKEY }}

